server.servlet.context-path=/cytech
server.port=7777
spring.thymeleaf.cache=false

spring.datasource.url=jdbc:mysql://localhost:8889/cytech_ec?useSSL=false&serverTimezone=Asia/Tokyo&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ソケット接続を使う場合はURL末尾に追記: &unixSocket=/Applications/MAMP/tmp/mysql/mysql.sock

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=debug
