<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>商品一覧</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container"><h1>商品一覧</h1>
<div class="grid">
  <div class="card" th:each="p : ${products}">
    <a th:href="@{'/product/' + ${p.id}}"><img th:src="${p.imgPath}" alt="" class="thumb"></a>
    <div class="body">
      <div class="name" th:text="${p.productName}">name</div>
      <div class="maker" th:text="${p.company.companyName}">company</div>
      <div class="price">税抜 <span th:text="${p.price}"></span> 円 / 税込 <strong th:text="${p.includeTax}"></strong> 円</div>
    </div>
  </div>
</div></main>
<div th:replace="~{fragments/footer :: footer}"></div></body></html>
