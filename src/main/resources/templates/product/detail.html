<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8">
<title th:text="${p.productName}">商品詳細</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container two-col"><section>
  <img th:src="${p.imgPath}" alt="" class="detail-img">
  <h1 th:text="${p.productName}">商品名</h1>
  <p>メーカー: <span th:text="${p.company.companyName}">Company</span></p>
  <p>カテゴリ: <span th:text="${p.category != null ? p.category.categoryName : 'なし'}"></span></p>
  <p th:text="${p.comment}">コメント</p>
  <h2>口コミ</h2>
  <div th:if="${#lists.isEmpty(reviews)}">まだ口コミはありません。</div>
  <div th:each="r : ${reviews}" class="review">
    <div><strong th:text="${r.dummyUserName}">user</strong> / 評価 <span th:text="${r.rating}">5</span></div>
    <div th:text="${r.comment}">comment</div>
  </div>
  <p><a th:href="@{'/review/' + ${p.id} + '/new'}">口コミを書き込む</a></p>
</section>
<aside class="sidebar">
  <form th:action="@{'/product/' + ${p.id} + '/add-to-cart'}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div>価格（税抜）: <span th:text="${p.price}"></span> 円</div>
    <div>税込: <strong th:text="${p.includeTax}"></strong> 円</div>
    <div>在庫: <span th:text="${p.stock}"></span></div>
    <label>数量:
      <select name="quantity"><option th:each="i : ${#numbers.sequence(1,10)}" th:value="${i}" th:text="${i}"></option></select>
    </label>
    <div style="margin-top:8px;"><button type="submit">カートに入れる</button></div>
  </form>
  <form th:action="@{'/product/' + ${p.id} + '/buy-now'}" method="post" style="margin-top:8px;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input type="hidden" name="quantity" value="1"><button type="submit">単品購入</button>
  </form>
</aside></main>
<div th:replace="~{fragments/footer :: footer}"></div></body></html>
