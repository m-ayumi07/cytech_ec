<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>購入情報入力</title>
<link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container two-col"><section>
  <h1>購入情報入力</h1>
  <form th:action="@{/order/confirm}" th:object="${orderEntryForm}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div><label>氏名: <input th:field="*{name}"></label><div class="err" th:errors="*{name}"></div></div>
    <div><label>住所: <input th:field="*{address}"></label><div class="err" th:errors="*{address}"></div></div>
    <div><label>アパート: <input th:field="*{apartment}"></label></div>
    <div><label>カード番号(15桁): <input th:field="*{cardNumber}"></label><div class="err" th:errors="*{cardNumber}"></div></div>
    <button type="submit">確認</button>
  </form>
</section>
<aside class="sidebar"><h2>注文内訳</h2>
<div th:each="c : ${items}">
  <div th:text="${c.product.productName}">name</div>
  <div>数量: <span th:text="${c.quantity}"></span> / 税込: <span th:text="${c.product.includeTax}"></span></div>
</div>
<hr><div>合計（税込）: <strong th:text="${total}"></strong> 円</div>
</aside></main>
<div th:replace="~{fragments/footer :: footer}"></div></body></html>
