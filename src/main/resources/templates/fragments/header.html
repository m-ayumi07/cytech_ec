<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="header">
  <header style="border-bottom:1px solid #ddd; padding:8px 0;">
    <div style="display:flex; gap:16px; align-items:center;">
      <div>ようこそ <strong th:text="${#authentication?.name}">user</strong> さん</div>

      <form th:action="@{/product/list}" method="get" style="display:flex; gap:8px;">
        <input type="text" name="q" placeholder="商品名で検索" />
        <select name="categoryId">
          <option value="">全カテゴリー</option>
          <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.categoryName}"></option>
        </select>
        <input type="text" name="company" placeholder="会社名で検索" />
        <button type="submit">検索</button>
      </form>

      <nav style="margin-left:auto; display:flex; gap:12px;">
        <a th:href="@{/product/list}">商品一覧</a>
        <a th:href="@{/user/mypage}">マイページ</a>
        <a th:href="@{/cart}">カート</a>


        <form th:action="@{/logout}" method="post" style="display:inline;">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <button type="submit" style="background:none;border:none;color:#06c;cursor:pointer;">ログアウト</button>
        </form>
      </nav>
    </div>
  </header>
</th:block>
</html>
