<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>口コミ投稿</title></head>
<body><div th:replace="~{fragments/header :: header}"></div>
<main class="container"><h1>口コミ投稿</h1>
<form th:action="@{'/review/' + ${productId} + '/submit'}" th:object="${reviewForm}" method="post">
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
  <div><label>ユーザー名: <input th:field="*{userName}"></label><div class="err" th:errors="*{userName}"></div></div>
  <div><label>メール: <input th:field="*{email}"></label><div class="err" th:errors="*{email}"></div></div>
  <div><label>評価(1-5): <input type="number" min="1" max="5" th:field="*{rating}"></label><div class="err" th:errors="*{rating}"></div></div>
  <div><label>コメント: <textarea th:field="*{comment}"></textarea></label><div class="err" th:errors="*{comment}"></div></div>
  <div><label>画像パス: <input th:field="*{imagePath}"></label></div>
  <button type="submit">投稿</button>
</form></main>
<div th:replace="~{fragments/footer :: footer}"></div></body></html>
